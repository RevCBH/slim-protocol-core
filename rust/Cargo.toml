[package]
name = "slim_protocol"
version = "0.1.0"
edition = "2021"
authors = ["SLIM Protocol Team"]
description = "SLIM (Structured Lightweight Interchange Markup) - Token-efficient data serialization for AI/LLM applications"
license = "MIT"
repository = "https://github.com/matteuccimarco/slim-protocol-core"
keywords = ["slim", "serialization", "json", "llm", "ai"]
categories = ["encoding", "data-structures"]
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"

# [[bench]]
# name = "benchmarks"
# harness = false

[lib]
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "slim"
path = "src/bin/slim.rs"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
